<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081835"/>
      <stop offset="100%" stop-color="#0c2447"/>
    </linearGradient>
    <linearGradient id="sat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ed6ff"/>
      <stop offset="100%" stop-color="#1a8cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2ed6ff" stroke-width="2"/>
  <!-- satellite body -->
  <rect x="26" y="26" width="12" height="12" rx="2" fill="#e8f7ff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3" fill="#0c2447"/>
  <!-- solar panels -->
  <rect x="8" y="28" width="16" height="8" rx="1" fill="url(#sat)" opacity="0.9"/>
  <rect x="40" y="28" width="16" height="8" rx="1" fill="url(#sat)" opacity="0.9"/>
  <!-- cross lines on panels -->
  <line x1="12" y1="30" x2="20" y2="34" stroke="#0c2447" stroke-width="0.8" opacity="0.4"/>
  <line x1="44" y1="30" x2="52" y2="34" stroke="#0c2447" stroke-width="0.8" opacity="0.4"/>
  <!-- dish / antenna -->
  <path d="M32 20 Q38 16 42 22" fill="none" stroke="#2ed6ff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="42" cy="22" r="1.8" fill="#ffd070"/>
  <line x1="32" y1="26" x2="32" y2="20" stroke="#2ed6ff" stroke-width="1.2"/>
  <!-- orbit accent -->
  <ellipse cx="32" cy="32" rx="22" ry="7" fill="none" stroke="#2ed6ff" stroke-width="0.8" opacity="0.35" transform="rotate(-20 32 32)"/>
</svg>