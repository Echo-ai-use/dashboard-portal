<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的看板导航</title>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --border: #e6e9f0;
    --text: #1f2430;
    --muted: #7a8194;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #eef0ff;
    --warning-bg: #fffbe6;
    --warning-border: #f0e6b8;
    --warning-text: #7d6a1e;
    --shadow: 0 1px 3px rgba(20,30,60,.06), 0 8px 24px rgba(20,30,60,.06);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* Top bars */
  .topbar {
    height: 60px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 0 18px; flex: none;
  }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), #7c6cf0); color: #fff; display: grid; place-items: center; font-size: 18px; }
  .brand-title { font-weight: 700; font-size: 16px; }
  .brand-sub { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .spacer { flex: 1; }
  .search { position: relative; }
  .search input {
    width: 240px; border: 1px solid var(--border); background: #fafbff; border-radius: 10px;
    padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; transition: .15s;
  }
  .search input:focus { border-color: var(--primary); background: #fff; width: 280px; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 10px;
    padding: 7px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; transition: .12s;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); color: #fff; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: #f6f7fb; }
  .view-bar { display: none; }

  /* Sidebar (only visible in viewer mode) */
  .sidebar {
    position: fixed; left: 0; top: 60px; bottom: 0; width: 280px; background: var(--panel);
    border-right: 1px solid var(--border); transform: translateX(-100%); transition: transform .2s;
    z-index: 10; overflow-y: auto; padding: 10px 10px 20px;
  }
  .mode-viewer .sidebar { transform: translateX(0); }
  .nav-group { margin-top: 8px; }
  .group-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    padding: 12px 8px 6px; font-weight: 600;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; color: var(--text); font-size: 13.5px; border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--primary-soft); }
  .nav-item.active { background: var(--primary-soft); border-color: #d8d6ff; font-weight: 600; }
  .nav-item .ico { width: 26px; height: 26px; border-radius: 7px; background: #f0f2f8; display: grid; place-items: center; font-size: 15px; flex: none; }
  .nav-item .meta { min-width: 0; }
  .nav-item .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item .d { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .scrim {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 5;
  }
  .mode-viewer-mobile .scrim.show { display: block; }

  /* Home */
  .home { flex: 1; overflow-y: auto; padding: 28px 32px; }
  .hero { max-width: 760px; margin-bottom: 28px; }
  .hero h2 { font-size: 28px; margin: 0 0 8px; letter-spacing: -.3px; }
  .hero p { color: var(--muted); margin: 0 0 18px; font-size: 14px; line-height: 1.6; }
  .alert {
    background: var(--warning-bg); border: 1px solid var(--warning-border); color: var(--warning-text);
    padding: 12px 16px; border-radius: 10px; font-size: 13px; line-height: 1.5; margin-bottom: 22px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .chip {
    border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 20px;
    padding: 5px 13px; font-size: 13px; cursor: pointer; transition: .12s;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s, box-shadow .12s;
    display: flex; flex-direction: column; gap: 12px; min-height: 130px;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(20,30,60,.1), 0 14px 30px rgba(20,30,60,.1); }
  .card .top { display: flex; align-items: center; gap: 12px; }
  .card .ico { width: 42px; height: 42px; border-radius: 12px; background: var(--primary-soft); display: grid; place-items: center; font-size: 22px; flex: none; }
  .card .name { font-weight: 600; font-size: 15.5px; }
  .card .group { font-size: 11px; color: var(--primary); background: var(--primary-soft); padding: 3px 10px; border-radius: 20px; align-self: flex-start; }
  .card .desc { color: var(--muted); font-size: 13px; line-height: 1.55; flex: 1; }
  .card .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }

  /* Viewer / Stage */
  .stage { flex: 1; display: none; min-height: 0; }
  .mode-viewer .stage { display: flex; flex-direction: column; margin-left: 280px; }
  .stage iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .frame-fallback {
    position: absolute; inset: 60px 0 0 280px; display: none; place-items: center; text-align: center;
    background: #fff; padding: 30px;
  }
  .frame-fallback.show { display: grid; }
  .frame-fallback .box { max-width: 360px; }
  .frame-fallback h3 { margin: 0 0 8px; font-size: 16px; }
  .frame-fallback p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  /* Responsive */
  @media (max-width: 760px) {
    .home { padding: 18px; }
    .hero h2 { font-size: 22px; }
    .search input { width: 140px; }
    .search input:focus { width: 170px; }
    .mode-viewer .stage { margin-left: 0; }
    .frame-fallback { inset: 60px 0 0 0; }
    .sidebar { top: 0; z-index: 30; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .mode-viewer .sidebar { transform: translateX(-100%); }
    .mode-viewer .sidebar.open { transform: translateX(0); }
  }
</style>
</head>
<body class="mode-home">
<div class="app">
  <header class="topbar home-bar" id="homeBar">
    <div class="logo">🧭</div>
    <span class="brand-title">我的看板导航</span>
    <span class="brand-sub">WorkBuddy 聚合门户</span>
    <div class="spacer"></div>
    <div class="search"><input id="search" type="text" placeholder="搜索看板…" /></div>
  </header>

  <header class="topbar view-bar" id="viewBar">
    <button class="btn" id="backBtn">← 总览</button>
    <div class="logo" id="viewLogo">📊</div>
    <span class="brand-title" id="viewTitle">看板</span>
    <div class="spacer"></div>
    <button class="btn ghost" id="menuBtn" title="展开看板列表">☰</button>
    <button class="btn" id="refreshBtn">↻ 刷新</button>
    <a class="btn primary" id="openNewBtn" target="_blank" rel="noopener">↗ 新窗口打开</a>
  </header>

  <main class="home" id="home">
    <div class="hero">
      <h2>看板总览</h2>
      <p>这里是你的 WorkBuddy 看板总入口。点击任意卡片即可在当前页面内嵌打开对应看板，左侧会出现导航条，方便你在不同看板间快速切换。</p>
    </div>
    <div class="alert" id="placeholderAlert">
      ⚠️ 当前显示的是<strong>示例数据</strong>。请把真实看板链接按「名称 | 链接」的格式发给我，我会替换掉这些占位卡片再部署上线。
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </main>

  <main class="stage" id="stage">
    <iframe id="frame" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
    <div class="frame-fallback" id="fallback">
      <div class="box">
        <h3>该看板无法在此内嵌显示</h3>
        <p>目标站点设置了禁止内嵌（X-Frame-Options / CSP）。请使用右上角「新窗口打开」按钮在独立标签页查看。</p>
        <a class="btn primary" id="fallbackOpen" target="_blank" rel="noopener">↗ 在新窗口打开</a>
      </div>
    </div>
  </main>
</div>

<aside class="sidebar" id="sidebar">
  <nav id="nav"></nav>
</aside>
<div class="scrim" id="scrim"></div>

<script>
/* ============================================================
   看板配置 —— 把下面的示例替换成你自己的看板即可
   字段：name(必填), url(必填), group(分组), desc(描述), icon(emoji)
   ============================================================ */
const DASHBOARDS = [
  { name: "全链路追踪看板",           url: "https://5bce59abca954c87b3ca9379abeadd00.bj4.agentos-app.net/",                                  group: "运营",   desc: "跨境电商新客户转化运营中枢",          icon: "📊" },
  { name: "马帮物流渠道匹配检查看板", url: "https://44c459c39fcd42d6b34386ade42e8fb4.app.workbuddy.host/",                                  group: "物流",   desc: "马帮物流渠道匹配检查",                icon: "🚚" },
  { name: "物流管家",                 url: "https://b0f2e66436f840878b975eacda79d60d.app.workbuddy.link/index_v15.html",                    group: "物流",   desc: "物流管家 v2.4",                        icon: "📦" },
];

const $ = (s) => document.querySelector(s);
const body = document.body;
let activeGroup = "全部";

function groups() {
  const map = new Map();
  DASHBOARDS.forEach((d, i) => {
    const g = d.group || "其他";
    if (!map.has(g)) map.set(g, []);
    map.get(g).push({ ...d, _i: i });
  });
  return map;
}

function visibleItems(filter = "") {
  const f = filter.trim().toLowerCase();
  return DASHBOARDS.map((d, i) => ({ ...d, _i: i })).filter(d => {
    const inSearch = !f || d.name.toLowerCase().includes(f) || (d.desc || "").toLowerCase().includes(f);
    const inGroup = activeGroup === "全部" || d.group === activeGroup;
    return inSearch && inGroup;
  });
}

function renderNav() {
  const nav = $("#nav");
  nav.innerHTML = "";
  const map = groups();
  for (const [g, items] of map) {
    const gt = document.createElement("div");
    gt.className = "group-title"; gt.textContent = g;
    nav.appendChild(gt);
    items.forEach(d => {
      const el = document.createElement("div");
      el.className = "nav-item"; el.dataset.idx = d._i;
      el.innerHTML = `<div class="ico">${d.icon || "📊"}</div>
        <div class="meta"><div class="n">${d.name}</div><div class="d">${d.desc || ""}</div></div>`;
      el.onclick = () => openDashboard(d._i);
      nav.appendChild(el);
    });
  }
}

function renderChips() {
  const chips = $("#chips");
  const gset = ["全部", ...new Set(DASHBOARDS.map(d => d.group || "其他"))];
  chips.innerHTML = gset.map(g => `<button class="chip ${g === activeGroup ? "active" : ""}" data-g="${g}">${g}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(btn => {
    btn.onclick = () => { activeGroup = btn.dataset.g; renderChips(); renderGrid(); };
  });
}

function renderGrid() {
  const grid = $("#grid");
  const items = visibleItems($("#search").value);
  if (!items.length) {
    grid.innerHTML = '<div style="color:var(--muted);font-size:13px">没有匹配的看板</div>';
    return;
  }
  grid.innerHTML = items.map(d => `
    <div class="card" data-idx="${d._i}">
      <div class="top"><div class="ico">${d.icon || "📊"}</div><div class="name">${d.name}</div></div>
      <div class="group">${d.group || "其他"}</div>
      <div class="desc">${d.desc || ""}</div>
      <div class="foot"><span>点击内嵌打开</span><span>↗</span></div>
    </div>
  `).join("");
  grid.querySelectorAll(".card").forEach(c => c.onclick = () => openDashboard(+c.dataset.idx));
}

function openDashboard(idx) {
  const d = DASHBOARDS[idx]; if (!d) return;
  $("#frame").src = d.url;
  $("#viewLogo").textContent = d.icon || "📊";
  $("#viewTitle").textContent = d.name;
  $("#openNewBtn").href = d.url;
  $("#fallbackOpen").href = d.url;
  $("#fallback").classList.remove("show");

  body.classList.remove("mode-home");
  body.classList.add("mode-viewer");
  $("#homeBar").style.display = "none";
  $("#viewBar").style.display = "flex";
  $("#home").style.display = "none";
  $("#stage").style.display = "flex";

  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", +n.dataset.idx === idx));
  closeSidebar();
}

function backHome() {
  body.classList.remove("mode-viewer");
  body.classList.add("mode-home");
  $("#homeBar").style.display = "flex";
  $("#viewBar").style.display = "none";
  $("#home").style.display = "block";
  $("#stage").style.display = "none";
  $("#frame").src = "about:blank";
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
}

function toggleSidebar() { $("#sidebar").classList.toggle("open"); $("#scrim").classList.toggle("show"); }
function closeSidebar() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }

$("#search").addEventListener("input", renderGrid);
$("#backBtn").onclick = backHome;
$("#menuBtn").onclick = toggleSidebar;
$("#scrim").onclick = closeSidebar;
$("#refreshBtn").onclick = () => { const u = $("#frame").src; if (u && u !== "about:blank") $("#frame").src = u; };

// Hide placeholder alert if user has replaced with real-looking URLs
const hasRealUrl = DASHBOARDS.some(d => !d.url.includes("example.com"));
if (hasRealUrl) $("#placeholderAlert").style.display = "none";

renderNav();
renderChips();
renderGrid();
</script>
</body>
</html>
